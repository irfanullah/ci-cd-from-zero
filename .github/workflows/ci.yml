name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show secret (demo only)
        run: echo "Secret is ${{ secrets.DEMO_SECRET }}"

      - name: Run Module 5 checks
        run: bash module-05-secrets-artifacts/check.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-5-artifact
          path: module-05-secrets-artifacts/artifact.txt
